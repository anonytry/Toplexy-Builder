name: Build Toplexy Kernel

on:
  workflow_dispatch:
    inputs:
      ksu_variant:
        description: 'KernelSU variant (ALL = VNL + KWS + KSUN)'
        type: choice
        options:
          - KWS
          - KSUN
          - VNL
          - ALL
        default: KWS
      platform:
        description: 'Config: gki (gki_defconfig only) or sky/parrot (merged gki + sky + parrot fragments)'
        type: choice
        options:
          - gki
          - sky/parrot
        default: sky/parrot
      clang_variant:
        description: 'Clang toolchain (CLANG-19 default for 5.10 GKI)'
        type: choice
        options:
          - CLANG-19
          - CLANG-12
          - ALL
        default: CLANG-19
      kernel_name:
        description: 'Kernel base name'
        type: string
        default: Toplexy
      kernel_repo:
        description: 'Kernel repository (owner/repo) to build'
        type: string
        default: TopexGuy/kernel_xiaomi_sky
      kernel_ref:
        description: 'Kernel branch / tag / SHA to build'
        type: string
        default: '17'
      modules_repo:
        description: 'Vendor modules repository (owner/repo)'
        type: string
        default: TopexGuy/kernel_xiaomi_sm8450-modules
      modules_ref:
        description: 'Vendor modules branch'
        type: string
        default: '17'
      device_repo:
        description: 'Device tree repo with prebuilt dtbs/dtbo.img (owner/repo)'
        type: string
        default: TopexGuy/device_xiaomi_sky
      device_ref:
        description: 'Device tree branch'
        type: string
        default: '17'
      susfs_branch:
        description: 'SUSFS kernel patch branch (gki-android12-5.10)'
        type: string
        default: gki-android12-5.10
      susfs_repo:
        description: 'SUSFS repo (owner/submodule; gitlab.com)'
        type: string
        default: simonpunk/susfs4ksu
      anykernel_repo:
        description: 'AnyKernel3 installer repo (owner/repo; github.com)'
        type: string
        default: XTENSEI/GrayRavens-anykernel
      anykernel_branch:
        description: 'AnyKernel3 installer branch'
        type: string
        default: android12-5.10
      clang12_repo:
        description: 'CLANG-12 (r416183b) toolchain repo (github.com)'
        type: string
        default: LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b
      clang12_branch:
        description: 'CLANG-12 toolchain branch (empty = default)'
        type: string
        default: ''
      clang19_repo:
        description: 'CLANG-19 (r536225) toolchain repo (gitlab.com)'
        type: string
        default: crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r536225
      clang19_branch:
        description: 'CLANG-19 toolchain branch (empty = default)'
        type: string
        default: ''
      ksu_repo:
        description: 'KernelSU repo (KWS variant)'
        type: string
        default: KOWX712/KernelSU
      ksu_ref:
        description: 'KernelSU branch (KWS)'
        type: string
        default: master
      ksun_repo:
        description: 'KernelSU-Next repo (KSUN variant)'
        type: string
        default: pershoot/KernelSU-Next
      ksun_ref:
        description: 'KernelSU-Next branch (KSUN)'
        type: string
        default: dev-susfs

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      ksu_variants: ${{ steps.resolve.outputs.ksu_variants }}
      platforms: ${{ steps.resolve.outputs.platforms }}
      clang_variants: ${{ steps.resolve.outputs.clang_variants }}
    steps:
      - name: Resolve variants
        id: resolve
        run: |
          if [ "${{ inputs.ksu_variant }}" = "ALL" ]; then
            echo 'ksu_variants=["VNL","KWS","KSUN"]' >> "$GITHUB_OUTPUT"
          else
            echo 'ksu_variants=["${{ inputs.ksu_variant }}"]' >> "$GITHUB_OUTPUT"
          fi
          echo 'platforms=["${{ inputs.platform }}"]' >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.clang_variant }}" = "ALL" ]; then
            echo 'clang_variants=["CLANG-12","CLANG-19"]' >> "$GITHUB_OUTPUT"
          else
            echo 'clang_variants=["${{ inputs.clang_variant }}"]' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.ksu }} / ${{ matrix.platform }} / ${{ matrix.clang }})
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ksu: ${{ fromJson(needs.setup.outputs.ksu_variants) }}
        platform: ${{ fromJson(needs.setup.outputs.platforms) }}
        clang: ${{ fromJson(needs.setup.outputs.clang_variants) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            bc bison flex build-essential libssl-dev libelf-dev \
            cpio kmod rsync zip patch curl ca-certificates \
            python3 python3-pip python3-lxml git wget binutils zstd \
            pahole gcc-aarch64-linux-gnu device-tree-compiler

      - name: Cache AOSP Clang r416183b
        if: matrix.clang == 'CLANG-12'
        id: cache-aosp-12
        uses: actions/cache@v4
        with:
          path: ~/toolchain/aosp-clang-r416183b
          key: aosp-clang-r416183b-x86_64

      - name: Download AOSP Clang r416183b
        if: matrix.clang == 'CLANG-12' && steps.cache-aosp-12.outputs.cache-hit != 'true'
        run: |
          URL="${{ inputs.clang12_repo }}"
          case "$URL" in
            http*) ;;
            *) URL="https://github.com/${URL}" ;;
          esac
          if [ -n "${{ inputs.clang12_branch }}" ]; then
            git clone --depth=1 --branch "${{ inputs.clang12_branch }}" "$URL" ~/toolchain/aosp-clang-r416183b
          else
            git clone --depth=1 "$URL" ~/toolchain/aosp-clang-r416183b
          fi

      - name: Download Clang 19
        if: matrix.clang == 'CLANG-19'
        run: |
          URL="${{ inputs.clang19_repo }}"
          case "$URL" in
            http*) ;;
            *) URL="https://gitlab.com/${URL}" ;;
          esac
          if [ -n "${{ inputs.clang19_branch }}" ]; then
            git clone --depth=1 --branch "${{ inputs.clang19_branch }}" "$URL" ~/toolchain/aosp-r536225
          else
            git clone --depth=1 "$URL" ~/toolchain/aosp-r536225
          fi

      - name: Export CLANG_PATH
        run: |
          case "${{ matrix.clang }}" in
            CLANG-19) echo "CLANG_PATH=$HOME/toolchain/aosp-r536225" >> "$GITHUB_ENV" ;;
            CLANG-12) echo "CLANG_PATH=$HOME/toolchain/aosp-clang-r416183b" >> "$GITHUB_ENV" ;;
          esac

      - name: Set platform label
        id: plabel
        run: |
          case "${{ matrix.platform }}" in
            sky/parrot) echo 'label=skyparrot' >> "$GITHUB_OUTPUT" ;;
            *) echo 'label=${{ matrix.platform }}' >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Notify build start
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request
          token = os.environ.get("TELEGRAM_TOKEN")
          chat = os.environ.get("TELEGRAM_CHAT")
          if token and chat:
              text = "🚀 Starting Toplexy build: ${{ matrix.ksu }} / ${{ matrix.platform }} / ${{ matrix.clang }}\n🌿 Branch: ${{ inputs.kernel_ref }}"
              payload = json.dumps({"chat_id": chat, "text": text, "parse_mode": ""}).encode("utf-8")
              req = urllib.request.Request(f"https://api.telegram.org/bot{token}/sendMessage", data=payload, headers={"Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=15):
                      pass
              except Exception:
                  pass
          EOF

      - name: Clone kernel source
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: |
          URL="${{ inputs.kernel_repo }}"
          case "$URL" in
            http*) ;;
            *) URL="https://github.com/${URL}" ;;
          esac
          TOKEN_URL=""
          DEFAULT_URL="https://github.com/TopexGuy/kernel_xiaomi_sky"
          if [ -n "$GIT_TOKEN" ] && [ "$URL" != "$DEFAULT_URL" ]; then
            case "$URL" in
              https://github.com/*) TOKEN_URL="https://x-access-token:${GIT_TOKEN}@github.com/${URL#https://github.com/}" ;;
            esac
          fi
          if [ -n "$TOKEN_URL" ]; then
            echo "GIT_TOKEN set - attempting authenticated clone"
            if git clone --depth=1 --branch "${{ inputs.kernel_ref }}" "$TOKEN_URL" kernel; then
              exit 0
            fi
            echo "WARNING: authenticated clone failed (bad/invalid token?) - falling back to plain https"
          fi
          git clone --depth=1 --branch "${{ inputs.kernel_ref }}" "$URL" kernel

      - name: Clone vendor modules
        run: |
          URL="${{ inputs.modules_repo }}"
          case "$URL" in
            http*) ;;
            *) URL="https://github.com/${URL}" ;;
          esac
          git clone --depth=1 --branch "${{ inputs.modules_ref }}" "$URL" modules

      - name: Clone device prebuilts
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: |
          URL="${{ inputs.device_repo }}"
          case "$URL" in
            http*) ;;
            *) URL="https://github.com/${URL}" ;;
          esac
          TOKEN_URL=""
          if [ -n "$GIT_TOKEN" ]; then
            case "$URL" in
              https://github.com/*) TOKEN_URL="https://x-access-token:${GIT_TOKEN}@github.com/${URL#https://github.com/}" ;;
            esac
          fi
          if [ -n "$TOKEN_URL" ]; then
            echo "GIT_TOKEN set - attempting authenticated clone"
            if git clone --depth=1 --branch "${{ inputs.device_ref }}" "$TOKEN_URL" device; then
              exit 0
            fi
            echo "WARNING: authenticated clone failed (bad/invalid token?) - falling back to plain https"
          fi
          git clone --depth=1 --branch "${{ inputs.device_ref }}" "$URL" device

      - name: Notify sources cloned
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request
          token = os.environ.get("TELEGRAM_TOKEN")
          chat = os.environ.get("TELEGRAM_CHAT")
          if token and chat:
              text = "📥 Sources cloned (${{ inputs.kernel_repo }} @ ${{ inputs.kernel_ref }})"
              payload = json.dumps({"chat_id": chat, "text": text, "parse_mode": ""}).encode("utf-8")
              req = urllib.request.Request(f"https://api.telegram.org/bot{token}/sendMessage", data=payload, headers={"Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=15):
                      pass
              except Exception:
                  pass
          EOF

      - name: Apply KernelSU (KWS only)
        if: matrix.ksu == 'KWS'
        working-directory: kernel
        run: |
          KSU_REPO="${{ inputs.ksu_repo }}"
          case "$KSU_REPO" in
            http*) KSU_REPO="$(printf '%s' "$KSU_REPO" | sed -E 's#^https?://[^/]+/##; s#\.git$##')" ;;
          esac
          curl -LSs "https://raw.githubusercontent.com/${KSU_REPO}/${{ inputs.ksu_ref }}/kernel/setup.sh" | bash -s ${{ inputs.ksu_ref }}
          FRAGMENT="arch/arm64/configs/gki_defconfig"
          [ "${{ matrix.platform }}" = "sky/parrot" ] && FRAGMENT="arch/arm64/configs/vendor/parrot_GKI.config"
          printf '\nCONFIG_KSU=y\nCONFIG_KSU_MANUAL_SU=n\nCONFIG_KSU_SUSFS=n\n' >> "$FRAGMENT"

      - name: Apply KernelSU-Next (KSUN only)
        if: matrix.ksu == 'KSUN'
        working-directory: kernel
        run: |
          KSUN_REPO="${{ inputs.ksun_repo }}"
          case "$KSUN_REPO" in
            http*) KSUN_REPO="$(printf '%s' "$KSUN_REPO" | sed -E 's#^https?://[^/]+/##; s#\.git$##')" ;;
          esac
          curl -LSs "https://raw.githubusercontent.com/${KSUN_REPO}/${{ inputs.ksun_ref }}/kernel/setup.sh" | bash -s ${{ inputs.ksun_ref }}
          FRAGMENT="arch/arm64/configs/gki_defconfig"
          [ "${{ matrix.platform }}" = "sky/parrot" ] && FRAGMENT="arch/arm64/configs/vendor/parrot_GKI.config"
          printf '\nCONFIG_KSU=y\nCONFIG_KSU_MANUAL_SU=n\nCONFIG_KSU_SUSFS=y\n' >> "$FRAGMENT"

      - name: Apply SUSFS patches (KSUN only)
        if: matrix.ksu == 'KSUN'
        working-directory: kernel
        run: |
          SUSFS_BRANCH="${{ inputs.susfs_branch }}"
          SUSFS_REPO="${{ inputs.susfs_repo }}"
          case "$SUSFS_REPO" in
            http*) ;;
            *) SUSFS_REPO="https://gitlab.com/${SUSFS_REPO}" ;;
          esac
          git clone "$SUSFS_REPO" -b "${SUSFS_BRANCH}" sus
          rm -rf sus/.git
          susfs=sus/kernel_patches
          cp -r "$susfs/fs" .
          cp -r "$susfs/include" .
          PATCH_FILE="$susfs/50_add_susfs_in_${SUSFS_BRANCH}.patch"
          if [ ! -f "$PATCH_FILE" ]; then
            echo "FATAL: patch $PATCH_FILE not found in susfs4ksu ${SUSFS_BRANCH}"
            exit 1
          fi
          cp "$PATCH_FILE" .
          patch -p1 < "$(basename "$PATCH_FILE")" || true

          # The android12-5.10 upstream patch calls 4-arg set_nameidata() at
          # three sites while android12-5.10 uses the 3-arg signature; drop the
          # trailing ", NULL".  A failed hunk in fs/proc/bootconfig.c is
          # EXPECTED (kaguya covers it) and is harmless.
          if grep -q 'set_nameidata(nd, old_dfd, fake_filename, NULL);' fs/namei.c; then
            sed -i 's/set_nameidata(nd, old_dfd, fake_filename, NULL);/set_nameidata(nd, old_dfd, fake_filename);/' fs/namei.c
            echo "susfs: applied set_nameidata() 3-arg workaround (dropped ', NULL')"
          elif grep -q 'set_nameidata(nd, old_dfd, fake_filename);' fs/namei.c; then
            echo "susfs: upstream patch already uses 3-arg set_nameidata() - no workaround needed"
          else
            echo "FATAL: SUSFS fs/namei.c OPEN_REDIRECT hunks did not apply"
            exit 1
          fi

      - name: Notify KernelSU applied
        if: matrix.ksu != 'VNL'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request
          token = os.environ.get("TELEGRAM_TOKEN")
          chat = os.environ.get("TELEGRAM_CHAT")
          if token and chat:
              text = "🌱 ${{ matrix.ksu }} integrated successfully (${{ matrix.platform }})"
              payload = json.dumps({"chat_id": chat, "text": text, "parse_mode": ""}).encode("utf-8")
              req = urllib.request.Request(f"https://api.telegram.org/bot{token}/sendMessage", data=payload, headers={"Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=15):
                      pass
              except Exception:
                  pass
          EOF

      - name: Set LOCALVERSION
        working-directory: kernel
        run: |
          # Cap LOCALVERSION so the release string stays under the kernel's
          # 64-char utsrelease limit.  Full branding lives in the zip name.
          KN="$(echo "${{ inputs.kernel_name }}" | cut -c1-30 | sed 's/-$//')"
          LOCALVER="-${KN}-${{ matrix.ksu }}"
          FRAGMENT="arch/arm64/configs/gki_defconfig"
          [ "${{ matrix.platform }}" = "sky/parrot" ] && FRAGMENT="arch/arm64/configs/vendor/parrot_GKI.config"
          printf '\nCONFIG_LOCALVERSION="%s"\n' "$LOCALVER" >> "$FRAGMENT"

      - name: Notify kernel compilation starting
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request
          token = os.environ.get("TELEGRAM_TOKEN")
          chat = os.environ.get("TELEGRAM_CHAT")
          if token and chat:
              text = "⚙️ Compiling ${{ matrix.platform }} kernel (${{ matrix.ksu }} / ${{ matrix.clang }})..."
              payload = json.dumps({"chat_id": chat, "text": text, "parse_mode": ""}).encode("utf-8")
              req = urllib.request.Request(f"https://api.telegram.org/bot{token}/sendMessage", data=payload, headers={"Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=15):
                      pass
              except Exception:
                  pass
          EOF

      - name: Run build.sh
        id: run_build
        working-directory: kernel
        env:
          CLANG_PATH: ${{ env.CLANG_PATH }}
          CLANG_VARIANT: ${{ matrix.clang }}
          PLATFORM: ${{ matrix.platform }}
          MODULES_DIR: ${{ github.workspace }}/modules
          DEVICE_DIR: ${{ github.workspace }}/device
        run: |
          cp "$GITHUB_WORKSPACE/build.sh" .
          cp "$GITHUB_WORKSPACE/selinux.sh" .
          chmod +x build.sh
          set -o pipefail
          ./build.sh 2>&1 | tee ../build.log

      - name: Handle build failure & send error log
        if: failure() && steps.run_build.outcome == 'failure'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request, uuid

          token = os.environ.get("TELEGRAM_TOKEN")
          chat = os.environ.get("TELEGRAM_CHAT")
          if not token or not chat:
              exit(0)

          snippet = "No build log captured"
          log_path = "build.log"
          if os.path.isfile(log_path):
              try:
                  with open(log_path, "r", errors="replace") as f:
                      lines = f.readlines()
                      snippet = "".join(lines[-25:])
              except Exception as e:
                  snippet = f"Could not read log: {e}"

          msg = (
              "❌ Build Failed: ${{ matrix.ksu }} / ${{ matrix.platform }} / ${{ matrix.clang }}\n"
              "🌿 Branch: ${{ inputs.kernel_ref }}\n"
              "🔗 Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\n"
              "📋 Error snippet:\n"
              f"```\n{snippet}\n```"
          )

          try:
              payload = json.dumps({"chat_id": chat, "text": msg, "parse_mode": ""}).encode("utf-8")
              req = urllib.request.Request(f"https://api.telegram.org/bot{token}/sendMessage", data=payload, headers={"Content-Type": "application/json"})
              with urllib.request.urlopen(req, timeout=15):
                  pass
          except Exception as e:
              print(f"Failed to send failure text: {e}")

          if os.path.isfile(log_path) and os.path.getsize(log_path) > 0:
              boundary = uuid.uuid4().hex
              body = bytearray()
              body.extend(f"--{boundary}\r\nContent-Disposition: form-data; name=\"chat_id\"\r\n\r\n{chat}\r\n".encode("utf-8"))
              body.extend(f"--{boundary}\r\nContent-Disposition: form-data; name=\"caption\"\r\n\r\n📄 Error log for ${{ matrix.ksu }} / ${{ matrix.platform }}\r\n".encode("utf-8"))
              fname = "build-${{ matrix.ksu }}-${{ steps.plabel.outputs.label }}.log"
              body.extend(f"--{boundary}\r\nContent-Disposition: form-data; name=\"document\"; filename=\"{fname}\"\r\nContent-Type: text/plain\r\n\r\n".encode("utf-8"))
              with open(log_path, "rb") as f:
                  body.extend(f.read())
              body.extend(f"\r\n--{boundary}--\r\n".encode("utf-8"))
              try:
                  req = urllib.request.Request(f"https://api.telegram.org/bot{token}/sendDocument", data=body, headers={"Content-Type": f"multipart/form-data; boundary={boundary}"})
                  with urllib.request.urlopen(req, timeout=30):
                      pass
              except Exception as e:
                  print(f"Failed to send document: {e}")
          EOF

      - name: Upload build log artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.ksu }}-${{ steps.plabel.outputs.label }}-${{ matrix.clang }}
          path: build.log
          if-no-files-found: ignore

      - name: Notify kernel compiled
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request
          token = os.environ.get("TELEGRAM_TOKEN")
          chat = os.environ.get("TELEGRAM_CHAT")
          if token and chat:
              text = "📦 Kernel compiled successfully! Packaging AnyKernel3 zip..."
              payload = json.dumps({"chat_id": chat, "text": text, "parse_mode": ""}).encode("utf-8")
              req = urllib.request.Request(f"https://api.telegram.org/bot{token}/sendMessage", data=payload, headers={"Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=15):
                      pass
              except Exception:
                  pass
          EOF

      - name: Package with AnyKernel3
        run: |
          ZIP_NAME="${{ inputs.kernel_name }}-${{ matrix.ksu }}-${{ steps.plabel.outputs.label }}-${{ matrix.clang }}"
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"
          URL="${{ inputs.anykernel_repo }}"
          case "$URL" in
            http*) ;;
            *) URL="https://github.com/${URL}" ;;
          esac
          git clone --depth=1 --branch ${{ inputs.anykernel_branch }} "$URL" anykernel

          if [ -f kernel/out/arch/arm64/boot/Image ]; then
            cp kernel/out/arch/arm64/boot/Image anykernel/Image
          elif [ -f kernel/out/arch/arm64/boot/Image.gz ]; then
            cp kernel/out/arch/arm64/boot/Image.gz anykernel/Image.gz
          fi
          cp kernel/out/arch/arm64/boot/dtbo.img anykernel/ 2>/dev/null || true

          # Device tree blobs → anykernel/dtbs/ (AK3 picks these up for
          # BOARD_INCLUDE_DTB_IN_BOOTIMG style builds)
          if ls kernel/out/arch/arm64/boot/dts/vendor/qcom/*.dtb >/dev/null 2>&1; then
            mkdir -p anykernel/dtbs
            cp kernel/out/arch/arm64/boot/dts/vendor/qcom/*.dtb anykernel/dtbs/
          fi

          # All kernel modules (in-tree + external vendor modules) — the
          # modules_install staging under kernel/out is the source of truth.
          mkdir -p anykernel/modules
          find kernel/out -type f -name "*.ko" -exec cp {} anykernel/modules/ \; 2>/dev/null || true

          ls -lah anykernel/
          cd anykernel
          zip -r9 "../${ZIP_NAME}.zip" . --exclude="*.git*" --exclude="README.md" --exclude="*.placeholder"

      - name: Upload zip to Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ZIP_NAME="${{ inputs.kernel_name }}-${{ matrix.ksu }}-${{ steps.plabel.outputs.label }}-${{ matrix.clang }}"
          export ZIPPATH="${ZIP_NAME}.zip"
          python3 - <<'EOF'
          import os, uuid, urllib.request

          token = os.environ.get("TELEGRAM_TOKEN")
          chat  = os.environ.get("TELEGRAM_CHAT")
          zpath = os.environ.get("ZIPPATH")

          if not (token and chat and zpath and os.path.isfile(zpath)):
              print(f"Telegram upload skipped (token={bool(token)}, chat={bool(chat)}, file={zpath!r}, exists={os.path.isfile(zpath) if zpath else False})")
              exit(0)

          fname    = os.path.basename(zpath)
          caption  = (
              f"📦 {fname}\n"
              f"🔗 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          )
          boundary = uuid.uuid4().hex

          def field(name, value):
              return (
                  f"--{boundary}\r\n"
                  f'Content-Disposition: form-data; name="{name}"\r\n\r\n'
                  f"{value}\r\n"
              ).encode()

          body = bytearray()
          body += field("chat_id", chat)
          body += field("caption", caption)
          body += (
              f"--{boundary}\r\n"
              f'Content-Disposition: form-data; name="document"; filename="{fname}"\r\n'
              f"Content-Type: application/zip\r\n\r\n"
          ).encode()
          with open(zpath, "rb") as f:
              body += f.read()
          body += f"\r\n--{boundary}--\r\n".encode()

          req = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendDocument",
              data=bytes(body),
              headers={"Content-Type": f"multipart/form-data; boundary={boundary}"},
          )
          try:
              with urllib.request.urlopen(req, timeout=120) as resp:
                  print("Telegram upload OK:", resp.status)
          except Exception as e:
              print(f"Telegram upload failed: {e}")
          EOF

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}.zip

      - name: Upload kernel config
        uses: actions/upload-artifact@v4
        with:
          name: kernelconfig-${{ matrix.ksu }}-${{ steps.plabel.outputs.label }}-${{ matrix.clang }}
          path: kernel/out/.config
          if-no-files-found: ignore

  notify:
    name: Telegram Summary
    needs: [setup, build]
    if: always()
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Get run metadata
        id: meta
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          CREATED=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" --jq .created_at 2>/dev/null || echo "${{ github.event.workflow_run.created_at || github.event.repository.updated_at }}")
          START=$(date -d "$CREATED" +%s 2>/dev/null || echo 0)
          NOW=$(date +%s)
          ELAPSED=$(( NOW - START ))
          MINS=$(( ELAPSED / 60 ))
          SECS=$(( ELAPSED % 60 ))
          DURATION="${MINS}m ${SECS}s"

          CONCLUSION="${{ needs.build.result }}"
          if [ "$CONCLUSION" = "success" ]; then
            STATUS="✅ Passed"
          elif [ "$CONCLUSION" = "failure" ]; then
            STATUS="❌ Failed"
          elif [ "$CONCLUSION" = "cancelled" ]; then
            STATUS="⚠️ Cancelled"
          else
            STATUS="⚠️ $CONCLUSION"
          fi

          echo "created=$CREATED" >> "$GITHUB_OUTPUT"
          echo "duration=$DURATION" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "run_url=$RUN_URL" >> "$GITHUB_OUTPUT"

      - name: Get kernel source commit
        id: kernel_commit
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: |
          REPO="${{ inputs.kernel_repo }}"
          REF="${{ inputs.kernel_ref }}"
          case "$REPO" in
            http*) REPO="$(printf '%s' "$REPO" | sed -E 's#^https?://[^/]+/##; s#\.git$##')" ;;
          esac
          if [ -n "$GIT_TOKEN" ]; then
            CLONE_URL="https://x-access-token:${GIT_TOKEN}@github.com/${REPO}"
            API_AUTH="Authorization: Bearer ${GIT_TOKEN}"
          else
            CLONE_URL="https://github.com/${REPO}"
            API_AUTH=""
          fi
          SHA=$(git ls-remote "$CLONE_URL" "refs/heads/$REF" | head -1 | cut -f1)
          if [ -z "$SHA" ]; then
            SHA=$(git ls-remote "$CLONE_URL" "refs/tags/$REF" | head -1 | cut -f1)
          fi
          SHORT_SHA=$(echo "$SHA" | cut -c1-7)
          COMMIT_URL="https://github.com/${REPO}/commit/${SHA}"
          COMMIT_MSG=$(curl -s -H "$API_AUTH" "https://api.github.com/repos/${REPO}/commits/${SHA}" | python3 -c "import sys,json; c=json.load(sys.stdin); print(c.get('commit',{}).get('message','').split(chr(10))[0][:80])" 2>/dev/null || echo "")
          echo "sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "url=$COMMIT_URL" >> "$GITHUB_OUTPUT"
          echo "msg=$COMMIT_MSG" >> "$GITHUB_OUTPUT"

      - name: Collect artifacts with sizes
        id: artifacts
        run: |
          ARTIFACTS=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq '.artifacts[] | select(.name | endswith(".zip")) | "\(.name) (\(.size_in_bytes / 1048576 * 100 | floor / 100) MB)"' 2>/dev/null || echo "")
          if [ -z "$ARTIFACTS" ]; then
            ARTIFACTS="(no artifacts)"
          fi
          echo "list<<EOF" >> "$GITHUB_OUTPUT"
          echo "$ARTIFACTS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Send Telegram notification
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request

          token = os.environ.get("TELEGRAM_TOKEN")
          chat = os.environ.get("TELEGRAM_CHAT")
          if not token or not chat:
              exit(0)

          lines = [
              "\U0001FAA1 Toplexy Kernel Build Complete",
              "#Toplexy #GrayRavens",
              "",
              "\U0001F4C5 Created: ${{ steps.meta.outputs.created }}",
              "\U0001F527 Kernel: ${{ inputs.kernel_name }}",
              "\U0001F4E6 Repo: ${{ inputs.kernel_repo }}",
              "\U0001F33F Branch: ${{ inputs.kernel_ref }}",
              "\U0001F4DD Commit: ${{ steps.kernel_commit.outputs.sha }} - ${{ steps.kernel_commit.outputs.msg }}",
              "\U0001F517 ${{ steps.kernel_commit.outputs.url }}",
              "\u23F1 Duration: ${{ steps.meta.outputs.duration }}",
              "\U0001F4CA Status: ${{ steps.meta.outputs.status }}",
              "",
              "\U0001F4E6 Variants: ${{ inputs.ksu_variant }} / ${{ inputs.platform }} / ${{ inputs.clang_variant }}",
              "",
              "\U0001F4E6 Artifacts:",
              """${{ steps.artifacts.outputs.list }}""",
              "",
              "\U0001F517 Summary: ${{ steps.meta.outputs.run_url }}"
          ]
          text = "\n".join(lines)
          payload = json.dumps({"chat_id": chat, "text": text, "parse_mode": ""}).encode("utf-8")
          req = urllib.request.Request(f"https://api.telegram.org/bot{token}/sendMessage", data=payload, headers={"Content-Type": "application/json"})
          try:
              with urllib.request.urlopen(req, timeout=30):
                  pass
          except Exception as e:
              print(f"Failed to send telegram message: {e}")
          EOF