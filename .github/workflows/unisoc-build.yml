name: Build Unisoc Vendor Kernel

on:
  workflow_dispatch:
    inputs:
      kernel_name:
        description: 'Kernel base name'
        type: string
        default: GrayRavens-Zenithed
      kernel_ref:
        description: 'kernel branch / tag / SHA to build'
        type: string
        default: master
      kernel_repo:
        description: 'Kernel repository (owner/repo) to build'
        type: string
        default: XTENSEI/kernel_unisoc-5.4
      anykernel_branch:
        description: 'AnyKernel3 installer branch'
        type: string
        default: android11-5.4

jobs:
  build:
    name: Build (KSUN / CLANG-12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            bc bison flex build-essential libssl-dev libelf-dev \
            cpio kmod rsync zip patch curl ca-certificates \
            python3 python3-pip python3-lxml git wget binutils zstd \
            pahole

      - name: Cache AOSP Clang r416183b
        id: cache-aosp-12
        uses: actions/cache@v4
        with:
          path: ~/toolchain/aosp-clang-r416183b
          key: aosp-clang-r416183b-x86_64

      - name: Download AOSP Clang r416183b
        if: steps.cache-aosp-12.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git ~/toolchain/aosp-clang-r416183b

      - name: Export CLANG_PATH
        run: echo "CLANG_PATH=$HOME/toolchain/aosp-clang-r416183b" >> "$GITHUB_ENV"

      - name: Shallow-clone kernel source
        run: |
          git clone --depth=1 --branch "${{ inputs.kernel_ref }}" "https://github.com/${{ inputs.kernel_repo }}" kernel

      - name: Init submodules
        working-directory: kernel
        run: |
          # The shallow clone doesn't fetch submodules.
          # Clone each one manually.

          # KernelSU-Next → pershoot/KernelSU-Next
          KSUN_COMMIT=$(git ls-tree HEAD -- KernelSU-Next | awk '{print $3}')
          echo "KernelSU-Next commit: $KSUN_COMMIT"
          rm -rf KernelSU-Next
          git clone --depth=1 https://github.com/pershoot/KernelSU-Next.git KernelSU-Next
          cd KernelSU-Next
          git fetch --depth=1 origin "$KSUN_COMMIT" 2>/dev/null || true
          git checkout "$KSUN_COMMIT" 2>/dev/null || echo "Using latest (shallow)"
          cd ..
          echo "KernelSU-Next OK: $(ls KernelSU-Next/kernel/Kconfig 2>/dev/null && echo 'Kconfig found' || echo 'Kconfig MISSING')"
          echo "drivers/kernelsu: $(readlink drivers/kernelsu)"

          # Baseband-guard → vc-teahouse/Baseband-guard
          BBG_COMMIT=$(git ls-tree HEAD -- Baseband-guard | awk '{print $3}')
          echo "Baseband-guard commit: $BBG_COMMIT"
          rm -rf Baseband-guard
          git clone --depth=1 https://github.com/vc-teahouse/Baseband-guard.git Baseband-guard
          cd Baseband-guard
          git fetch --depth=1 origin "$BBG_COMMIT" 2>/dev/null || true
          git checkout "$BBG_COMMIT" 2>/dev/null || echo "Using latest (shallow)"
          cd ..
          echo "Baseband-guard OK: $(ls Baseband-guard/Kconfig 2>/dev/null && echo 'Kconfig found' || echo 'Kconfig MISSING')"

      - name: Apply KSU-Next 5.4 compat patches
        working-directory: kernel
        run: |
          # The compat header (ksun_compat.h) is already in the vendor tree.
          # Only need to run the compat script for fsnotify, seccomp, SELinux stubs.
          if [ -f ../ksun-54-compat.sh ]; then
            bash ../ksun-54-compat.sh
          else
            echo "WARNING: ksun-54-compat.sh not found — skipping compat patches"
          fi

      - name: Run build.sh (vendor kernel variant)
        working-directory: kernel
        env:
          CLANG_PATH: ${{ env.CLANG_PATH }}
          CLANG_VARIANT: CLANG-12
          KMI_SYMBOL_CHECK: "false"
        run: |
          cat > build-vendor.sh << 'BUILDEOF'
          #!/bin/bash
          # GrayRavens Unisoc Vendor Kernel Build Script
          set -e
          trap 'echo "Build failed at line $LINENO. Exit code: $?" >&2' ERR

          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export KBUILD_BUILD_USER="GrayRavens-Team"
          export KBUILD_BUILD_HOST="Zenithed-V1-Nova"

          if [ -z "$CLANG_PATH" ]; then
              echo "ERROR: CLANG_PATH is not set." >&2
              exit 1
          fi

          export PATH="${CLANG_PATH}/bin:${PATH}"

          echo "CLANG_VARIANT : '${CLANG_VARIANT}'"
          echo "Toolchain path: $CLANG_PATH"
          echo "Clang version : $("$CLANG_PATH/bin/clang" --version | head -n1)"

          # Polly check
          POLLY_FLAGS=""
          if "$CLANG_PATH/bin/clang" -mllvm -polly -x c /dev/null -o /dev/null 2>/dev/null; then
              echo "Polly: available"
              POLLY_FLAGS="-mllvm -polly \
           -mllvm -polly-run-dce \
           -mllvm -polly-run-inliner \
           -mllvm -polly-reschedule=1 \
           -mllvm -polly-loopfusion-greedy=1 \
           -mllvm -polly-vectorizer=stripmine \
           -mllvm -polly-detect-keep-going"
          else
              echo "Polly: not available — skipping"
          fi

          export KCFLAGS="-w -fno-semantic-interposition ${POLLY_FLAGS}"

          # The vendor Makefile hardcodes -march=armv8.2-a+crypto+crc+lse
          # which AOSP Clang 12 rejects as unknown target CPU.
          # Replace with -mcpu which Clang understands.
          sed -i 's/-march=armv8.2-a+crypto+crc+lse -mtune=cortex-a75/-mcpu=cortex-a75/' Makefile
          echo "Patched Makefile: replaced -march/-mtune with -mcpu for LLVM compatibility"

          # AOSP Clang needs explicit --target for cross-compilation.
          # The 5.4 vendor Makefile doesn't set this like newer kernels.
          export CC="clang --target=aarch64-linux-gnu"
          echo "CC=$CC"

          echo "Generating unisoc_defconfig..."
          make O=out CC="$CC" unisoc_defconfig

          echo "Building kernel image..."
          make -j$(nproc --all) O=out CC="$CC" Image

          echo ""
          echo "=== Post-build verification ==="
          echo "--- Compiler ---"
          readelf -p .comment out/vmlinux 2>/dev/null | grep -v "^$\|String dump" || echo "Could not read .comment"
          echo "--- Kernel version ---"
          strings out/vmlinux 2>/dev/null | grep -E -m1 'Linux version' || echo "Could not read version"
          echo "=== Done ==="

          echo "Build completed successfully! Toolchain: ${CLANG_VARIANT}"
          BUILDEOF
          chmod +x build-vendor.sh
          ./build-vendor.sh

      - name: Package with AnyKernel3
        run: |
          ZIP_NAME="${{ inputs.kernel_name }}-KSUN-CLANG12"
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"
          git clone --depth=1 --branch ${{ inputs.anykernel_branch }} https://github.com/XTENSEI/GrayRavens-anykernel anykernel
          cp kernel/out/arch/arm64/boot/Image anykernel/Image
          cd anykernel
          zip -r9 "../${ZIP_NAME}.zip" . --exclude="*.git*" --exclude="README.md" --exclude="*.placeholder"

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}.zip

  notify:
    name: Telegram Summary
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Get run metadata
        id: meta
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          START=$(date -d "${{ github.event.workflow_run.created_at || github.event.repository.updated_at }}" +%s 2>/dev/null || echo 0)
          NOW=$(date +%s)
          ELAPSED=$(( NOW - START ))
          MINS=$(( ELAPSED / 60 ))
          SECS=$(( ELAPSED % 60 ))
          DURATION="${MINS}m ${SECS}s"

          CONCLUSION="${{ needs.build.result }}"
          if [ "$CONCLUSION" = "success" ]; then
            STATUS="✅ Passed"
          elif [ "$CONCLUSION" = "failure" ]; then
            STATUS="❌ Failed"
          elif [ "$CONCLUSION" = "cancelled" ]; then
            STATUS="⚠️ Cancelled"
          else
            STATUS="⚠️ $CONCLUSION"
          fi

          echo "duration=$DURATION" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "run_url=$RUN_URL" >> "$GITHUB_OUTPUT"

      - name: Get kernel source commit
        id: kernel_commit
        run: |
          REPO="${{ inputs.kernel_repo }}"
          REF="${{ inputs.kernel_ref }}"
          CLONE_URL="https://github.com/${REPO}"
          SHA=$(git ls-remote "$CLONE_URL" "refs/heads/$REF" | head -1 | cut -f1)
          if [ -z "$SHA" ]; then
            SHA=$(git ls-remote "$CLONE_URL" "refs/tags/$REF" | head -1 | cut -f1)
          fi
          SHORT_SHA=$(echo "$SHA" | cut -c1-7)
          COMMIT_URL="https://github.com/${REPO}/commit/${SHA}"
          COMMIT_MSG=$(curl -s "https://api.github.com/repos/${REPO}/commits/${SHA}" | python3 -c "import sys,json; c=json.load(sys.stdin); print(c.get('commit',{}).get('message','').split(chr(10))[0][:80])" 2>/dev/null || echo "")
          echo "sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "url=$COMMIT_URL" >> "$GITHUB_OUTPUT"
          echo "msg=$COMMIT_MSG" >> "$GITHUB_OUTPUT"

      - name: Collect artifacts with sizes
        id: artifacts
        run: |
          ARTIFACTS=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq '.artifacts[] | select(.name | endswith(".zip")) | "\(.name) (\(.size_in_bytes / 1048576 * 100 | floor / 100) MB)"' 2>/dev/null || echo "")
          if [ -z "$ARTIFACTS" ]; then
            ARTIFACTS="(no artifacts)"
          fi
          echo "list<<EOF" >> "$GITHUB_OUTPUT"
          echo "$ARTIFACTS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Send Telegram notification
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG="🪡 Unisoc Vendor Kernel Build Complete
#GrayRavens

📅 Created: ${{ github.event.workflow_run.created_at || github.event.repository.updated_at }}
🔧 Kernel: ${{ inputs.kernel_name }}
📦 Repo: ${{ inputs.kernel_repo }}
🌿 Branch: ${{ inputs.kernel_ref }}
📝 Commit: ${{ steps.kernel_commit.outputs.sha }} - ${{ steps.kernel_commit.outputs.msg }}
🔗 ${{ steps.kernel_commit.outputs.url }}
⏱ Duration: ${{ steps.meta.outputs.duration }}
📊 Status: ${{ steps.meta.outputs.status }}

📦 Artifacts:
${{ steps.artifacts.outputs.list }}

🔗 Summary: ${{ steps.meta.outputs.run_url }}"

          ESCAPED=$(echo "$MSG" | python3 -c "import sys,json; print(json.dumps(sys.stdin.read()))")

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"${TELEGRAM_CHAT}\", \"text\": ${ESCAPED}, \"parse_mode\": \"\"}"
